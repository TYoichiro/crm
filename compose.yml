services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "8000:5432"
    volumes:
      - db_data:/var/lib/postgresql

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://crm:crm@db:5432/crm
    ports:
      - "8011:4000"
    depends_on:
      - db
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8011
    ports:
      - "8010:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  db_data:
